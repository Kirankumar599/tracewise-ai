services:
  # TraceWise AI - Python ML Anomaly Detection Microservice
  - type: web
    name: tracewise-ml
    runtime: docker
    rootDir: tracewise-ml
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
