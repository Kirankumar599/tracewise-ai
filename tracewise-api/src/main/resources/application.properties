spring.application.name=tracewise-api
server.port=${PORT:8081}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ML Service endpoint and timeouts
tracewise.ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
tracewise.ml.connect-timeout-ms=${ML_CONNECT_TIMEOUT_MS:2000}
tracewise.ml.read-timeout-ms=${ML_READ_TIMEOUT_MS:3000}

# CORS Allowed Origins
tracewise.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app}
