name: TraceWise AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-ci:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: tracewise-ui/package-lock.json

      - name: Install dependencies
        working-directory: tracewise-ui
        run: npm ci

      - name: Build frontend production bundle
        working-directory: tracewise-ui
        env:
          VITE_API_BASE_URL: http://localhost:8081
        run: npm run build

  python-ml-ci:
    name: Python ML Service & Anomaly Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tracewise-ml/requirements.txt

      - name: Install dependencies
        working-directory: tracewise-ml
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate model training & artifacts
        working-directory: tracewise-ml
        run: python train_model.py

      - name: Run ML service test suite
        working-directory: tracewise-ml
        run: python test_ml_service.py

  java-api-ci:
    name: Spring Boot API & Root Cause Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        working-directory: tracewise-api
        run: chmod +x mvnw

      - name: Run Maven unit and integration tests
        working-directory: tracewise-api
        run: ./mvnw clean test -B

  container-config-ci:
    name: Container Configuration Validation
    needs: [ frontend-ci, python-ml-ci, java-api-ci ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose configuration
        run: docker compose config -q
